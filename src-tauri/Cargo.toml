[package]
name = "excel-unlock"
version = "0.1.0"
description = "Excel & VBA password remover for personal use"
authors = ["Personal"]
edition = "2021"

[lib]
name = "excel_unlock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
cfb = "0.10"
regex = "1"
anyhow = "1"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
strip = true
